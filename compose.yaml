services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${COLOR_KITCHEN_DEV_DB_USER:-ck_dev}
      POSTGRES_PASSWORD: ${COLOR_KITCHEN_DEV_DB_PASSWORD:-ck_dev_local}
      POSTGRES_DB: color_kitchen_test
    ports:
      - "127.0.0.1:${COLOR_KITCHEN_DEV_DB_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 15
volumes:
  postgres-data:
