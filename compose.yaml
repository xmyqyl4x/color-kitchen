services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ck_dev
      POSTGRES_PASSWORD: ck_dev_local
      POSTGRES_DB: color_kitchen_test
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ck_dev", "-d", "color_kitchen_test"]
      interval: 2s
      timeout: 5s
      retries: 15
volumes:
  postgres-data:
