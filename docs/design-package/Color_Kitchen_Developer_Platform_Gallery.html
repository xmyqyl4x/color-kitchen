<main>

<figure id="P2-A"><figcaption><b>P2-A · Developer theme editor</b><p>A project owner maps six game interface roles and checks the selected tile and action label against a clearly labelled sample board. Committed revision 7 remains private until an owner chooses its release audience.</p></figcaption>
<img width="1500" height="1000" alt="A project owner maps six game interface roles and checks the selected tile and action label against a clearly labelled sample board. Committed revision 7 remains private until an owner chooses its release audience." src="mockups/developer-platform/P2-A-developer-theme-editor.png" loading="lazy" decoding="async"></figure>

<figure id="P2-B"><figcaption><b>P2-B · Catalog publication</b><p>A staff publisher reviews English, French, Spanish, Portuguese and German in the same release, together with provenance and version checks. Publication changes the public catalog and records the action.</p></figcaption>
<img width="1500" height="1000" alt="A staff publisher reviews English, French, Spanish, Portuguese and German in the same release, together with provenance and version checks. Publication changes the public catalog and records the action." src="mockups/developer-platform/P2-B-five-language-catalog-publication.png" loading="lazy" decoding="async"></figure>

<figure id="P2-C"><figcaption><b>P2-C · Mobile release and export</b><p>The release audience defaults to project members. An owner must deliberately select and confirm public access. Download and copy actions produce independent copies. The final release action names the selected audience.</p></figcaption>
<img width="414" height="1020" alt="The release audience defaults to project members. An owner must deliberately select and confirm public access. Download and copy actions produce independent copies. The final release action names the selected audience." src="mockups/developer-platform/P2-C-mobile-theme-release.png" loading="lazy" decoding="async"></figure>

<figure id="P2-D"><figcaption><b>P2-D · AI client authorization</b><p>This example selects one project for an external client. Each protected request identifies a theme asset within a selected project and reads its current release. The server checks current membership and grant status on every call.</p></figcaption>
<img width="1500" height="1000" alt="This example selects one project for an external client. Each protected request identifies a theme asset within a selected project and reads its current release. The server checks current membership and grant status on every call." src="mockups/developer-platform/P2-D-connector-project-authorization.png" loading="lazy" decoding="async"></figure>
</main>
