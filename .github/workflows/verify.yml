name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: ck_dev
          POSTGRES_PASSWORD: ck_dev_local
          POSTGRES_DB: color_kitchen_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U ck_dev -d color_kitchen_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
        env:
          COLOR_KITCHEN_TEST_DATABASE_URL: postgresql://ck_dev:ck_dev_local@127.0.0.1:${{ job.services.postgres.ports[5432] }}/color_kitchen_test
