name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: ck_dev
          POSTGRES_PASSWORD: ck_dev_local
          POSTGRES_DB: color_kitchen_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U ck_dev -d color_kitchen_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
        env:
          COLOR_KITCHEN_TEST_DATABASE_URL: postgresql://ck_dev:ck_dev_local@127.0.0.1:${{ job.services.postgres.ports[5432] }}/color_kitchen_test
      - name: Rehearse migration and restore
        run: node dist/tests/rehearse-release.js > "$RUNNER_TEMP/release-rehearsal.json"
        env:
          COLOR_KITCHEN_TEST_DATABASE_URL: postgresql://ck_dev:ck_dev_local@127.0.0.1:${{ job.services.postgres.ports[5432] }}/color_kitchen_test
          COLOR_KITCHEN_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
      - name: Upload disposable rehearsal evidence
        uses: actions/upload-artifact@v7
        with:
          name: release-rehearsal
          path: ${{ runner.temp }}/release-rehearsal.json
          if-no-files-found: error
          retention-days: 14
      - name: Build and smoke-test the release image
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          image=color-kitchen:verify
          web="ck-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$web" >/dev/null 2>&1 || true' EXIT
          docker build --build-arg "REVISION=$GITHUB_SHA" --tag "$image" .
          docker exec "$POSTGRES_CONTAINER" createdb -U ck_dev ck_ci_release
          database=postgresql://ck_dev:ck_dev_local@127.0.0.1:5432/ck_ci_release
          docker run --rm --network "container:$POSTGRES_CONTAINER" -e "DATABASE_URL=$database" "$image" node dist/src/db/cli.js
          docker run --rm --network "container:$POSTGRES_CONTAINER" -e "DATABASE_URL=$database" "$image" node dist/src/catalog/seed-cli.js
          docker run --detach --name "$web" --network "container:$POSTGRES_CONTAINER" -e "DATABASE_URL=$database" \
            -e PORT=3100 -e COLOR_KITCHEN_ORIGIN=https://color-kitchen.example.test "$image"
          for attempt in {1..25}; do
            status=$(docker inspect "$web" --format '{{.State.Health.Status}}')
            if [ "$status" = healthy ]; then break; fi
            sleep 1
          done
          test "$status" = healthy
          docker exec -i "$web" node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const listener = 'http://127.0.0.1:' + process.env.PORT;
          const publicOrigin = process.env.COLOR_KITCHEN_ORIGIN;
          for (const locale of ['en', 'fr', 'es', 'pt', 'de']) {
            const home = await fetch(listener + '/' + locale);
            assert.equal(home.status, 200);
            assert.equal(home.headers.get('content-language'), locale);
            assert.match(home.headers.get('set-cookie'), /; Secure/);
            const html = await home.text();
            assert.match(html, new RegExp('<html lang="' + locale + '"'));
            assert(html.includes('<link rel="canonical" href="' + publicOrigin + '/' + locale + '">'));
            const detail = await fetch(listener + '/api/v1/catalog/palette/forest-study?locale=' + locale);
            assert.equal(detail.status, 200);
            assert.equal((await detail.json()).data.entry.revision, 1);
          }
          const robots = await fetch(listener + '/robots.txt');
          assert.equal(robots.status, 200);
          assert((await robots.text()).includes('Sitemap: ' + publicOrigin + '/sitemap.xml'));
          const sitemap = await fetch(listener + '/sitemap.xml');
          assert.equal(sitemap.status, 200);
          const xml = await sitemap.text();
          assert(xml.includes('<loc>' + publicOrigin + '/fr/palettes/forest-study</loc>'));
          assert(!xml.includes(listener));
          for (const asset of ['/assets/kitchen.css', '/assets/source-sans.woff2', '/assets/social-card.png', '/vendor/pdf-lib.js', '/src/web/studio-client.js']) {
            assert.equal((await fetch(listener + asset, { method: 'HEAD' })).status, 200, asset);
          }
          JS
